<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Hexagonal Container -->
  <path d="M512 80L944 329.4v499.2L512 944L80 828.6V329.4L512 80z" fill="url(#hexGrad)" stroke="#06B6D4" stroke-width="12" filter="url(#dropShadow)"/>
  <path d="M512 100L925 338.4v491.2L512 924L99 829.6V338.4L512 100z" fill="none" stroke="#F59E0B" stroke-width="4" opacity="0.6"/>

  <!-- Character: Captain Geppy -->
  <g transform="translate(512, 530)">
    <!-- Body -->
    <path d="M-100 250 C-120 150, -100 50, -50 0 L50 0 C100 50, 120 150, 100 250 Z" fill="url(#goldGrad)"/>
    <!-- Head -->
    <circle cx="0" cy="-80" r="110" fill="#F59E0B"/>
    <!-- Cyan Visor -->
    <rect x="-70" y="-110" width="140" height="60" rx="20" fill="#06B6D4" filter="url(#glow)"/>
    <!-- Plasma Wrench -->
    <path d="M80 -20 L180 -120 L210 -90 L110 10 Z" fill="#6366F1" stroke="#fff" stroke-width="4"/>
    <circle cx="180" cy="-120" r="20" fill="#06B6D4" filter="url(#glow)"/>
  </g>

  <!-- UI Badges -->
  <rect x="362" y="800" width="300" height="60" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="512" y="840" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="bold" fill="#F59E0B" text-anchor="middle">GITBRIDGE</text>
  
  <g transform="translate(760, 240)">
    <circle cx="0" cy="0" r="40" fill="#06B6D4"/>
    <text x="0" y="10" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">v3.0</text>
  </g>

  <!-- Decorative Inner Grid -->
  <path d="M200 512 H824 M512 200 V824" stroke="#6366F1" stroke-width="1" opacity="0.2"/>
</svg>