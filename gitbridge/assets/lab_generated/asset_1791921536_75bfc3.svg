<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d20"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="svg_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg_grad)"/>
  <!-- Hexagonal Silhouette Body -->
  <polygon points="256,22 458,138 458,374 256,490 54,374 54,138" fill="#0f172a" stroke="#f59e0b" stroke-width="12" filter="url(#svg_glow)"/>
  <polygon points="256,38 438,146 438,366 256,474 74,366 74,146" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.75"/>

  <!-- Specular Glass Sheen -->
  <path d="M 64 64 L 380 64 L 160 380 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Glyph Element -->
  <g filter="url(#svg_glow)" transform="translate(256, 256)">
    <circle cx="0" cy="0" r="100" fill="#0f172a" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6"/>
    <polygon points="0,-40 40,0 0,40 -40,0" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  </g>
</svg>