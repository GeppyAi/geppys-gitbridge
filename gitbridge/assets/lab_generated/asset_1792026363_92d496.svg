<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hexagonal Container -->
  <path d="M512 80L888 297.33v435.34L512 950L136 732.67V297.33L512 80z" fill="url(#hexGrad)" stroke="#6366F1" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Circuit Grid Pattern -->
  <g opacity="0.15" stroke="#06B6D4" stroke-width="1">
    <path d="M200 200h600v600h-600z" fill="none"/>
    <line x1="512" y1="150" x2="512" y2="874"/>
    <line x1="250" y1="300" x2="774" y2="724"/>
    <line x1="774" y1="300" x2="250" y2="724"/>
  </g>

  <!-- Central Core Glow -->
  <circle cx="512" cy="512" r="150" fill="url(#coreGlow)"/>

  <!-- G-Glyph (Brushed Titanium) -->
  <g transform="translate(300, 300) scale(0.6)">
    <path d="M512 100C285 100 100 285 100 512s185 412 412 412s412-185 412-412h-150c0 144-118 262-262 262s-262-118-262-262s118-262 262-262v-150z" 
          fill="url(#metalGrad)" stroke="#F8FAFC" stroke-width="20" stroke-linejoin="round"/>
  </g>

  <!-- Futuristic Console Accents -->
  <g stroke="#06B6D4" stroke-width="4" fill="none">
    <path d="M400 400 L450 400 M574 400 L624 400 M400 624 L450 624 M574 624 L624 624"/>
    <circle cx="512" cy="512" r="280" stroke-dasharray="10 20"/>
  </g>

  <!-- Decorative HUD Elements -->
  <text x="512" y="850" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#F8FAFC" text-anchor="middle" font-size="32" letter-spacing="4">BRIDGE_CMD</text>
  <rect x="462" y="870" width="100" height="4" fill="#06B6D4"/>
</svg>